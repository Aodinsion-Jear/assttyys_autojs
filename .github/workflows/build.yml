name: Build and Release

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Patch UI - skip GitHub OAuth
        run: |
          node -e "
          const fs = require('fs');
          let content = fs.readFileSync('node_modules/assttyys_ui/dist/index.html', 'utf-8');
          const oldStr = 'nt(async()=>{t.value&&a(),c()});';
          const newStr = 'nt(async()=>{ll.replace(\"/SchemeManagementPage\")});';
          content = content.replace(oldStr, newStr);
          fs.writeFileSync('node_modules/assttyys_ui/dist/index.html', content);
          console.log('UI patched');
          "

      - name: Build
        run: npm run build

      - name: Upload to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_UPLOAD_PATH: ${{ secrets.SERVER_UPLOAD_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p \"$(dirname \"$SERVER_UPLOAD_PATH\")\""
          scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" assttyys_ng.zip "$SERVER_USER@$SERVER_HOST:$SERVER_UPLOAD_PATH"
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "ls -lh \"$SERVER_UPLOAD_PATH\""

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: assttyys_ng.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
